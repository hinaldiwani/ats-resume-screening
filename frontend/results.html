<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screening Results · ATS Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="results" data-page-title="Screening Results">

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="app-main">
    <div id="navbar-root"></div>

    <main class="app-content">
      <div class="page-header d-flex flex-wrap align-items-end justify-content-between gap-2">
        <div>
          <h1>Backend Engineer</h1>
          <p>Ranked candidates for this role, sorted by match score.</p>
        </div>
        <span class="badge-c badge-neutral" id="resultsCount">— candidates</span>
      </div>

      <div class="section-card">
        <div class="section-card__body pb-0">
          <div class="filter-bar">
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="shortlisted">Shortlisted</button>
            <button class="filter-pill" data-filter="pending">Pending</button>
            <button class="filter-pill" data-filter="rejected">Rejected</button>

            <div class="ms-auto d-flex gap-2 flex-wrap">
              <div class="navbar-search" style="display:block; max-width:220px;">
                <i class="bi bi-search"></i>
                <input type="text" id="resultsSearchInput" placeholder="Search candidates...">
              </div>
              <select class="form-select-c" id="sortSelect" style="width:auto;">
                <option value="score-desc">Highest score first</option>
                <option value="score-asc">Lowest score first</option>
              </select>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table-c">
            <thead>
              <tr>
                <th style="width:110px;">Match score</th>
                <th>Candidate</th>
                <th>Skills</th>
                <th style="width:130px;">Status</th>
                <th style="width:100px;" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="resultsTableBody"></tbody>
          </table>
        </div>

        <div class="empty-state" id="resultsEmptyState" style="display:none;">
          <div class="empty-state__icon"><i class="bi bi-search"></i></div>
          <h3>No candidates match this filter</h3>
          <p>Try a different status filter, or upload more resumes to this job.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/results.js"></script>
</body>
</html>
