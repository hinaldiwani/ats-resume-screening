<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Result · ATS Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="results" data-page-title="Candidate Result">

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="app-main">
    <div id="navbar-root"></div>

    <main class="app-content">
      <a href="results.html" class="btn-ghost-sm mb-3 d-inline-flex"><i class="bi bi-arrow-left me-1"></i> Back to results</a>

      <div class="page-header d-flex flex-wrap align-items-start justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="sidebar-avatar" style="width:52px;height:52px;font-size:1.1rem; background:var(--brand-teal-tint); color:var(--brand-teal-dark);" id="candidateAvatar"></div>
          <div>
            <h1 class="mb-1" id="candidateName">—</h1>
            <p class="mb-0" id="candidateMeta">—</p>
          </div>
        </div>
        <span id="candidateStatusBadge"></span>
      </div>

      <div class="row g-3">
        <!-- ATS Score card -->
        <div class="col-lg-5">
          <div class="section-card h-100">
            <div class="section-card__header">
              <h2>ATS match score</h2>
            </div>
            <div class="section-card__body">
              <div class="d-flex justify-content-center mb-4" id="scoreGaugeContainer"></div>

              <div class="d-flex flex-column gap-3" id="scoreProgressBars">
                <!-- injected: semantic / skills / experience progress bars -->
              </div>
            </div>
          </div>
        </div>

        <!-- Skills card -->
        <div class="col-lg-7">
          <div class="section-card h-100">
            <div class="section-card__header">
              <h2>Skills match</h2>
              <span class="badge-c badge-neutral" id="skillsMatchSummary">—</span>
            </div>
            <div class="section-card__body">
              <div class="progress mb-1" style="height:8px; background:var(--border);">
                <div class="progress-bar" id="skillsProgressBar" role="progressbar" style="width:0%; background-color:var(--brand-teal);"></div>
              </div>
              <p class="form-hint mb-4">Share of required skills found in this resume.</p>

              <h3 class="fs-6 mb-2">Matching skills</h3>
              <div class="mb-4" id="matchingSkillsList"></div>

              <h3 class="fs-6 mb-2">Missing skills</h3>
              <div id="missingSkillsList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3 mt-1">
        <!-- Recommendation card -->
        <div class="col-lg-6">
          <div class="section-card h-100">
            <div class="section-card__header">
              <h2>Recommendation</h2>
            </div>
            <div class="section-card__body" id="recommendationList">
              <!-- injected by candidate-result.js -->
            </div>
          </div>
        </div>

        <!-- Resume Summary card -->
        <div class="col-lg-6">
          <div class="section-card h-100">
            <div class="section-card__header">
              <h2>Resume summary</h2>
            </div>
            <div class="section-card__body">
              <p class="text-secondary-c mb-0" id="resumeSummaryText" style="font-size:0.88rem; line-height:1.7;">—</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3 mt-1">
        <div class="col-12">
          <div class="section-card">
            <div class="section-card__body d-flex flex-wrap align-items-center justify-content-between gap-3">
              <p class="text-secondary-c mb-0" style="font-size:0.86rem;">Update this candidate's status once you've reviewed the details above.</p>
              <div class="d-flex gap-2">
                <button class="btn-outline-brand" id="rejectBtn"><i class="bi bi-x-lg me-1"></i> Reject</button>
                <button class="btn-brand" id="shortlistBtn"><i class="bi bi-check-lg me-1"></i> Shortlist</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/candidate-result.js"></script>
</body>
</html>
